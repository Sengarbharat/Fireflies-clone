# Render Blueprint for the FastAPI backend.
# Render dashboard > New > Blueprint > pick this repo. Then set CORS_ORIGINS
# to your Vercel URL (e.g. https://fireflies-clone.vercel.app).
services:
  - type: web
    name: fireflies-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./fireflies.db
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
